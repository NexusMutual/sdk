# Prep Latest Workflow
#
# Reusable workflow that prepares a production release:
# - Verifies that a version bump is needed based on conventional commits
# - Fast-forwards master branch from dev
# - Bumps the version in package.json and creates a version commit on master
# - Builds the code and runs all checks
# - Creates a git tag and GitHub release
# - Rebases the version bump commit back to dev branch
#
# Called by release.yml which handles the actual npm publish step.

name: Prep Latest

on:
  workflow_call:
    outputs:
      bumped_version:
        description: "The new version number after bump"
        value: ${{ jobs.bump-version.outputs.bumped_version }}
      artifact_name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build-and-checks.outputs.artifact_name }}

env:
  NODE_VERSION: 22
  PROVIDER_URL: ${{ secrets.PROVIDER_URL }}

jobs:
  check-version-bump:
    uses: NexusMutual/workflows/.github/workflows/check-version-bump.yml@chore/pnpm-setup
    with:
      ref: dev
      environment: production
      bump-command: |
        timeout 5s npx conventional-recommended-bump --config .github/config/conventional-bump-setup.js
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}

  validate-version-bump:
    needs: check-version-bump
    runs-on: ubuntu-22.04
    steps:
      - name: Verify version bump is needed
        if: needs.check-version-bump.outputs.triggers_bump != 'true'
        run: |
          echo "::error::Forbidden to release a version without a version bump"
          echo "::warning::Commit messages on the dev branch must include changes beyond 'docs', 'style', 'test', or 'ci'"
          echo "Please ensure your commits reflect meaningful changes to trigger an automatic version bump."
          exit 1
      - name: Confirm version bump
        run: |
          echo "Version bump of type '${{ needs.check-version-bump.outputs.bump_type }}' will be applied"

  ff-master:
    needs: [check-version-bump, validate-version-bump]
    uses: NexusMutual/workflows/.github/workflows/fast-forward.yml@chore/pnpm-setup
    with:
      environment: production
      source-ref: dev
      target-ref: master
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}

  bump-version:
    needs: [check-version-bump, ff-master]
    uses: NexusMutual/workflows/.github/workflows/bump.yml@chore/pnpm-setup
    with:
      environment: production
      ref: master
      bump-command: |
        echo 'Executing pnpm version bump: ${{ needs.check-version-bump.outputs.bump_type }}'
        pnpm version "${{ needs.check-version-bump.outputs.bump_type }}" --no-git-tag-version
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}

  build-and-checks:
    runs-on: ubuntu-22.04
    needs: bump-version
    outputs:
      artifact_name: sdk-${{ needs.bump-version.outputs.bumped_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build package
        run: pnpm run build

      - name: Run linter
        run: pnpm run lint

      - name: Check types and typescript
        run: pnpm run ts:check

      - name: Run tests
        run: pnpm run test

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ needs.bump-version.outputs.bumped_version }}
          path: dist

  git-tag-release:
    needs: build-and-checks
    uses: NexusMutual/workflows/.github/workflows/git-tag-github-release.yml@chore/pnpm-setup
    with:
      environment: production
      ref: master
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}

  rebase-dev:
    needs: build-and-checks
    uses: NexusMutual/workflows/.github/workflows/rebase.yml@chore/pnpm-setup
    with:
      environment: production
      source-ref: master
      target-ref: dev
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}
