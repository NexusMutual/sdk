# Release Workflow
#
# Entry-point for all npm publishing. Handles both production (@latest) and
# RC (@next) releases through a single workflow registered as the npm trusted publisher.
#
# Triggers:
# - workflow_dispatch: Production release (bumps version, publishes @latest)
# - push to dev: RC release (publishes @next with pre-release version)
#
# Architecture:
# - Calls prep-latest.yml or prep-next.yml for build/checks/version work
# - Runs pnpm publish directly in this file (OIDC token is scoped to this workflow)
# - sdk-bump-prs opens PRs in dependent repos after production publish

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  prep-latest:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/prep-latest.yml
    secrets: inherit

  prep-next:
    if: github.event_name == 'push'
    uses: ./.github/workflows/prep-next.yml
    secrets: inherit

  publish:
    needs: [prep-latest, prep-next]
    if: >-
      always() &&
      ((needs.prep-latest.result == 'success' && needs.prep-latest.outputs.artifact_name != '') ||
       (needs.prep-next.result == 'success' && needs.prep-next.outputs.artifact_name != ''))
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prep-latest.outputs.artifact_name || needs.prep-next.outputs.artifact_name }}
          path: dist

      - name: Remove prepare script
        run: pnpm pkg delete scripts.prepare

      - name: Set RC version
        if: github.event_name == 'push'
        run: pnpm version ${{ needs.prep-next.outputs.rc_version }} --no-git-tag-version

      - name: Publish
        run: pnpm publish --tag ${{ github.event_name == 'push' && 'next' || 'latest' }} --access public --ignore-scripts --no-git-checks

  sdk-bump-prs:
    if: github.event_name == 'workflow_dispatch' && needs.publish.result == 'success'
    needs: [prep-latest, publish]
    strategy:
      matrix:
        include:
          - repo: frontend-next
            base-branch: develop
            change-type: feat
          - repo: event-scanner
            base-branch: dev
            change-type: build
          - repo: order-book
            base-branch: dev
            change-type: build
          - repo: workers
            base-branch: dev
            change-type: build
      fail-fast: false
    uses: NexusMutual/workflows/.github/workflows/open-pr.yml@chore/pnpm-setup
    with:
      environment: production
      repository: ${{ matrix.repo }}
      base-branch: ${{ matrix.base-branch }}
      branch-name: '${{ matrix.change-type }}/nexusmutual-sdk-version-bump-${{ needs.prep-latest.outputs.bumped_version }}-${{ github.run_id }}'
      change-command: pnpm i --save-exact @nexusmutual/sdk@${{ needs.prep-latest.outputs.bumped_version }}
      commit-message: '${{ matrix.change-type }}: update @nexusmutual/sdk to ${{ needs.prep-latest.outputs.bumped_version }}'
      pr-body: 'updated @nexusmutual/sdk to [${{ needs.prep-latest.outputs.bumped_version }}](https://github.com/NexusMutual/sdk/releases/tag/v${{ needs.prep-latest.outputs.bumped_version }})'
    secrets:
      DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
      DEPLOYER_APP_PK: ${{ secrets.DEPLOYER_APP_PK }}
